openapi: 3.0.3
info:
  title: CRM Prompt Normaliser
  description: 'Normalises a free-form CRM question into a validated execution plan: the metric, the tool
    that owns it, resolved dates, canonical entity filters, and the exact query text each backend tool
    parses correctly. Call this FIRST on every CRM data question, before any CRM tool.'
  version: 1.1.0
paths:
  /normalise:
    post:
      summary: Normalise Query
      description: 'Call this FIRST for every CRM data question, before selecting or calling any other
        tool.


        Send the user''s question exactly as they typed it. The response tells you

        which tool to call, with which query text, over which resolved dates.


        If "ok" is false, do not call any tool. Rephrase "clarification" naturally

        for the user, as a short question with numbered options they can answer

        with a single keystroke.


        If "ok" is true, execute every entry in "calls". Pass each "canonical_text"

        to its tool as the question parameter WITHOUT ANY MODIFICATION. Do not

        reword, reorder, re-punctuate or shorten it. The wording is chosen to match

        what that specific backend parser accepts, and altering it causes the tool

        to return data for the wrong period without raising an error.


        Send the whole call to the collaborator, not just the text: write "tool",

        "question", "start_date", "end_date" and "period_display" as labelled lines

        in the message. A collaborator with no tool name has to guess which of its

        tools you meant, and it guesses wrong silently.


        "call_count" is a checksum. Execute that many calls and confirm you have

        that many sets of rows before writing anything. Never display a table for a

        call that was not issued or did not return.


        Never show the user anything from "diagnostics"; it is internal engineering

        output. Put the period in the table heading using "period_display", and add

        no caveat, warning or note about it.'
      operationId: normalise_crm_query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormaliseRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormaliseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /format_funnel:
    post:
      summary: Format Funnel
      description: 'Call this after ANY funnel tool returns, from within the funnel agent that just called
        it.


        A funnel tool returns ONE flat record per row holding the stage counts and

        the conversion ratios interleaved in alphabetical order, so TL:VL and MB:MD

        sit among Total Leads and Junk Leads. It has to be shown as TWO tables:

        Funnel Metrics, then Funnel Conversion Ratios. Deriving that split by hand

        proved unreliable -- the same question produced two tables on one turn and

        one on the next -- so this endpoint does it deterministically.


        Send the funnel tool''s response in "response" EXACTLY as it came back --

        every key, unreordered, nothing dropped. Send the tool you called in "tool"

        and the period in "heading". Return the resulting "markdown",

        "metrics_table" and "ratios_table" to the master unchanged.


        It applies the fixed column order, exactly five ratio columns (TL:VL,

        VL:SOL, SOL:MB, MB:MD, MD:SD), Indian digit grouping, and a Total row

        copied from the response''s own totals block rather than summed. A

        single-row funnel gets no S.No and no Total row.


        If "missing_ratio_columns" comes back non-empty, the payload lost keys in

        transit -- resend the untouched response rather than displaying a short

        table. If "empty" comes back true the service found no records for that

        scope and period: say so in a sentence, and show no table and no graph.'
      operationId: format_funnel_tables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelFormatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelFormatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      description: Liveness check, including whether the entity vocabulary is loaded.
      operationId: normaliser_health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Normaliser Health
components:
  schemas:
    FunnelFormatRequest:
      properties:
        include_totals:
          type: boolean
          title: Include Totals
          description: Set false for ranked, filtered or assembled results when the original aggregate
            no longer applies.
          default: true
        period_column:
          type: string
          enum:
          - ''
          - Month
          - Quarter
          - Financial Year
          - Period
          title: Period Column
          description: Period column for explicitly assembled, labelled time-series rows.
          default: ''
        response:
          type: object
          title: Response
          description: The funnel tool's response, pasted through unchanged. Any of the shapes the seven
            funnel services return is accepted.
        heading:
          type: string
          title: Heading
          description: Period for the table headings, taken from period_display, for example 'FY2025-26'.
            Optional.
          default: ''
        show:
          type: string
          enum:
          - both
          - metrics
          - ratios
          title: Show
          description: '''both'' (the default and almost always correct), ''ratios'' only when the user
            said funnel ratios or conversion ratios, or ''metrics'' only when they said funnel metrics
            or stage counts.'
          default: both
        tool:
          type: string
          enum:
          - ''
          - lead_funnel
          - product_funnel
          - project_funnel
          - source_funnel
          - subsource_funnel
          - lead_user_funnel
          - sales_user_funnel
          title: Tool
          description: 'The tool field from the plan, copied exactly: lead_funnel, product_funnel, project_funnel,
            source_funnel, subsource_funnel, lead_user_funnel or sales_user_funnel. It names the breakdown
            column. Pass it: project_funnel returns its rows under the key ''product_wise_metrics'', so
            without the tool name a project breakdown would be headed Product.'
          default: ''
      type: object
      required:
      - response
      title: FunnelFormatRequest
    FunnelFormatResponse:
      properties:
        ok:
          type: boolean
          title: Ok
        row_count:
          type: integer
          title: Row Count
          default: 0
        scope_column:
          type: string
          title: Scope Column
          default: ''
        metrics_table:
          type: string
          title: Metrics Table
          default: ''
        ratios_table:
          type: string
          title: Ratios Table
          default: ''
        missing_ratio_columns:
          items:
            type: string
          type: array
          title: Missing Ratio Columns
          description: Required ratio columns absent from one or more rows. Compare against the original
            response to determine whether the backend or transmission omitted them.
        empty:
          type: boolean
          title: Empty
          description: 'True when the funnel service reported no rows for this scope and period. That
            is a real answer, not a failure: say there were no records, and show no table and no graph.'
          default: false
        missing_metric_columns:
          items:
            type: string
          type: array
          title: Missing Metric Columns
        warning:
          title: Warning
          nullable: true
          type: string
        markdown:
          type: string
          title: Markdown
          description: Both tables, ready to display. Copy this verbatim into the response; do not rebuild,
            reorder or re-format it.
          default: ''
        error:
          title: Error
          nullable: true
          type: string
      type: object
      required:
      - ok
      title: FunnelFormatResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    NormaliseRequest:
      properties:
        query:
          type: string
          maxLength: 8000
          minLength: 1
          title: Query
          description: The standalone CRM question, preserving the user's intent and explicit changes.
          example: Total leads for wave city between 1 April 2026 and 30 June 2026
        today:
          title: Today
          description: Reference date as YYYY-MM-DD. Omit to use the Asia/Kolkata business date. Only
            set this for testing.
          nullable: true
          type: string
          format: date
        decompose:
          type: boolean
          title: Decompose
          description: Split multi-entity and multi-period questions into separate tool calls. Leave true
            unless you specifically want one call.
          default: true
      type: object
      required:
      - query
      title: NormaliseRequest
    NormaliseResponse:
      properties:
        plan_id:
          type: string
          title: Plan Id
        ok:
          type: boolean
          title: Ok
          description: False means execute no CRM calls; explain the limitation or ask the supplied clarification.
        raw:
          type: string
          title: Raw
        calls:
          items:
            $ref: '#/components/schemas/ToolCallOut'
          type: array
          title: Calls
        call_count:
          type: integer
          title: Call Count
          default: 0
        agents:
          items:
            type: string
          type: array
          title: Agents
        clarification:
          title: Clarification
          description: When ok is false, the reason. Rephrase it naturally for the user. Do not disguise
            backend limitations as ambiguous user input.
          nullable: true
          type: string
        diagnostics:
          items:
            type: string
          type: array
          title: Diagnostics
          description: Internal diagnostic evidence. Do not print raw engineering text. Explain material
            coverage or validation limitations in plain language.
        decomposed:
          type: boolean
          title: Decomposed
          default: false
        blocked_reason:
          title: Blocked Reason
          description: A known backend capability limitation; do not execute a replacement period or metric.
          nullable: true
          type: string
      type: object
      required:
      - plan_id
      - ok
      - raw
      title: NormaliseResponse
    RankingOut:
      properties:
        direction:
          type: string
          enum:
          - top
          - bottom
          title: Direction
        count:
          title: Count
          description: Null means ordering all rows without a limit.
          nullable: true
          type: integer
          minimum: 1.0
      type: object
      required:
      - direction
      title: RankingOut
    ToolCallOut:
      properties:
        call_id:
          type: string
          title: Call Id
        tool:
          type: string
          title: Tool
          description: Backend tool to invoke.
        agent:
          type: string
          title: Agent
          description: Agent that owns this tool.
        metric:
          type: string
          title: Metric
          description: Canonical metric key.
        metric_label:
          type: string
          title: Metric Label
          description: Display label for the metric.
        canonical_text:
          type: string
          title: Canonical Text
          description: Send this EXACTLY as the tool's question or query parameter according to its schema.
            Do not reword, reorder, re-punctuate or 'tidy' it — the wording is chosen to match what that
            specific parser accepts.
        start_date:
          title: Start Date
          description: Resolved start, YYYY-MM-DD.
          nullable: true
          type: string
        end_date:
          title: End Date
          description: Resolved end, YYYY-MM-DD.
          nullable: true
          type: string
        period_kind:
          type: string
          title: Period Kind
        period_label:
          type: string
          title: Period Label
          description: Internal label. Do not show this to the user.
          default: ''
        period_display:
          type: string
          title: Period Display
          description: Clean period text for the table heading, e.g. 'FY2025-26' or 'April 2026 to June
            2026'. Use this in the heading only after verifying the applied backend period. A different
            span is a validation failure.
          default: ''
        comparison:
          type: string
          title: Comparison
          description: none | month_on_month | quarter_on_quarter | year_on_year
        groupings:
          items:
            type: string
          type: array
          title: Groupings
        rank:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RankingOut'
        defer_chart:
          type: boolean
          title: Defer Chart
          default: false
        collaborator_message:
          type: string
          title: Collaborator Message
          description: Ready-to-send JSON string containing this complete call. Copy as the collaborator
            message without rebuilding it or dropping fields.
        filters:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Filters
          description: Canonical entity values. Rows outside these values must not be shown.
      type: object
      required:
      - call_id
      - tool
      - agent
      - metric
      - metric_label
      - canonical_text
      - period_kind
      - comparison
      - collaborator_message
      title: ToolCallOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: https://cuspal-retroserrate-nancey.ngrok-free.dev
  description: Normaliser service
